[package]
name = "sonara-desktop"
version = "1.0.1"
description = "Local-first Sonara document reader"
authors = ["Sonara contributors"]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.191"
getrandom = "=0.4.3"
tauri = { version = "=2.10.3" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
