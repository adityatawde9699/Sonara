[package]
name = "sonara-desktop"
version = "1.0.6"
description = "Local-first Sonara document reader"
authors = ["Sonara contributors"]
edition = "2021"
rust-version = "1.90"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
libc = "=0.2.191"
getrandom = "=0.4.2"
tauri = { version = "=2.10.3" }

[target.'cfg(windows)'.dependencies]
# Job Objects keep each worker's process tree together (src/process_tree.rs).
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
