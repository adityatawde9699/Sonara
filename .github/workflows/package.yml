name: Build and publish desktop releases

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test application and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-react/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check release tag matches application versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/check_release_version.py
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Install frontend dependencies
        working-directory: ui-react
        run: npm ci
      - name: Run frontend tests and build
        working-directory: ui-react
        run: npm test && npm run build
      - name: Run marketing-site tests
        run: node --test site/scripts/downloads.test.mjs
      - name: Install Rust test environment
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev patchelf
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare Tauri resource path for Rust tests
        run: mkdir -p packaging/staging/sonara && touch packaging/staging/sonara/.ci-placeholder
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  package:
    name: Build ${{ matrix.label }} installer
    needs: validate
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            os: windows-latest
            platform: windows
            arch: x86_64
            bundle: nsis
          - label: Linux x86_64
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
            bundle: deb,appimage
          - label: macOS aarch64
            os: macos-15
            platform: macos
            arch: aarch64
            bundle: dmg
          - label: macOS x86_64
            os: macos-15-intel
            platform: macos
            arch: x86_64
            bundle: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-react/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements-runtime.txt
      - name: Verify native runner architecture
        run: python packaging/check_build_architecture.py --expected ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Windows NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Install Linux build and document tool dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev patchelf libfuse2 poppler-utils poppler-data tesseract-ocr tesseract-ocr-eng
      - name: Install macOS document tools
        if: runner.os == 'macOS'
        run: brew install poppler tesseract dylibbundler
      - name: Stage Windows Poppler and Tesseract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/stage_windows_tools.ps1 -OutputDirectory packaging/staging/sonara/tools
      - name: Stage Linux Poppler and Tesseract
        if: runner.os == 'Linux'
        run: python packaging/stage_linux_tools.py --output packaging/staging/sonara/tools
      - name: Stage macOS Poppler and Tesseract
        if: runner.os == 'macOS'
        run: bash packaging/stage_macos_tools.sh packaging/staging/sonara/tools
      - name: Sign bundled macOS document tools
        if: runner.os == 'macOS'
        run: bash packaging/sign_macos_tools.sh packaging/staging/sonara/tools
      - name: Smoke-check staged PDF and OCR tools
        run: python packaging/check_native_tools.py --tools packaging/staging/sonara/tools
      - name: Install Tauri CLI
        run: cargo install tauri-cli --locked
      - name: Install native Python runtime dependencies
        run: python -m pip install -r packaging/requirements-runtime.txt
      - name: Build frozen backend runtime
        run: python packaging/build_runtime.py --clean
      - name: Smoke-check the frozen inference runtime
        run: python packaging/check_frozen_runtime.py packaging/staging/sonara/sonara-runtime${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Prepare Windows code signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SONARA_WINDOWS_PFX_BASE64: ${{ secrets.SONARA_WINDOWS_PFX_BASE64 }}
          SONARA_WINDOWS_PFX_PASSWORD: ${{ secrets.SONARA_WINDOWS_PFX_PASSWORD }}
        run: ./packaging/prepare_windows_signing.ps1
      - name: Install frontend dependencies
        working-directory: ui-react
        run: npm ci
      - name: Build frontend
        working-directory: ui-react
        run: npm run build
      - name: Build native installer
        run: cargo tauri build --bundles ${{ matrix.bundle }}
      - name: Remove temporary macOS signing identity
        if: runner.os == 'macOS' && always()
        run: bash packaging/cleanup_macos_signing.sh
      - name: Normalize installer names
        run: python packaging/prepare_release_assets.py --bundle-root src-tauri/target/release/bundle --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output release-assets
      - name: Upload installer files
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Clean-runner install check · ${{ matrix.label }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            os: windows-latest
            platform: windows
            arch: x86_64
          - label: Linux x86_64
            os: ubuntu-24.04
            platform: linux
            arch: x86_64
          - label: macOS aarch64
            os: macos-15
            platform: macos
            arch: aarch64
          - label: macOS x86_64
            os: macos-15-intel
            platform: macos
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets
      - name: Install Windows package and verify preserved user data
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/smoke_installed_windows.ps1 -Installer release-assets/Sonara-windows-x86_64-setup.exe
      - name: Install Linux runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libayatana-appindicator3-1 librsvg2-2 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb
      - name: Install Linux package and verify AppImage
        if: runner.os == 'Linux'
        run: bash packaging/smoke_installed_linux.sh release-assets
      - name: Install macOS image and verify the signed app
        if: runner.os == 'macOS'
        run: bash packaging/smoke_installed_macos.sh "release-assets/Sonara-macos-${{ matrix.arch }}.dmg"

  publish:
    name: Publish GitHub Release
    needs: smoke
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Require platform signing credentials before publication
        env:
          WINDOWS_PFX: ${{ secrets.SONARA_WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.SONARA_WINDOWS_PFX_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          test -n "$WINDOWS_PFX" && test -n "$WINDOWS_PFX_PASSWORD" || { echo "Windows signing secrets are required."; exit 1; }
          test -n "$APPLE_CERTIFICATE" && test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_SIGNING_IDENTITY" || { echo "Apple Developer signing secrets are required."; exit 1; }
          test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo "Apple notarization credentials are required."; exit 1; }
      - name: Download all installer assets
        uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets are complete
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/verify_release_assets.py release-assets
      - name: Write installer checksums
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt
      - name: Publish release and installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "Sonara $RELEASE_TAG" \
            --generate-notes
