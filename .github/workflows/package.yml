name: Build and publish desktop releases

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build, such as v1.0.2. The tag must already exist; its commit is what gets built.
        required: true
        type: string
      target:
        description: Build installers. "unix" is Linux and macOS (Windows packaging is blocked, see docs/RELEASE_PROCESS.md); "all" includes Windows.
        required: true
        default: unix
        type: choice
        options:
          - unix
          - all
          - windows
          - linux
          - macos

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Test application and release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      package_matrix: ${{ steps.release-matrix.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-react/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt
      - name: Check release tag matches application versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python packaging/check_release_version.py
      - name: Install Python test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m unittest discover -s tests -v
      - name: Install frontend dependencies
        working-directory: ui-react
        run: npm ci
      - name: Run frontend tests and build
        working-directory: ui-react
        run: npm test && npm run build
      - name: Run marketing-site tests
        run: node --test site/scripts/downloads.test.mjs
      - name: Install Rust test environment
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev patchelf
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare Tauri resource path for Rust tests
        run: mkdir -p packaging/staging/sonara && touch packaging/staging/sonara/.ci-placeholder
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Select native release targets
        id: release-matrix
        env:
          RELEASE_TARGET: ${{ inputs.target || 'unix' }}
        run: |
          matrix="$(python packaging/release_matrix.py "$RELEASE_TARGET")"
          echo "package_matrix=$matrix" >> "$GITHUB_OUTPUT"

  package:
    name: Build ${{ matrix.label }} installer
    needs: validate
    # Signing secrets are read only by the steps that sign, never by the
    # dependency installs. Add required reviewers to the "release" environment
    # in repository settings so tag pushes cannot use the certificates unreviewed.
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.package_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-react/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packaging/requirements-runtime.txt
            packaging/requirements-runtime-nodeps.txt
      - name: Verify native runner architecture
        run: python packaging/check_build_architecture.py --expected ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - name: Install Windows NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --yes --no-progress
      - name: Install Linux build and document tool dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev patchelf libfuse2 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio poppler-utils poppler-data tesseract-ocr tesseract-ocr-eng
      - name: Install macOS document tools
        if: runner.os == 'macOS'
        run: brew install poppler tesseract dylibbundler
      - name: Stage Windows Poppler and Tesseract
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/stage_windows_tools.ps1 -OutputDirectory packaging/staging/sonara/tools
      - name: Stage Linux Poppler and Tesseract
        if: runner.os == 'Linux'
        run: python packaging/stage_linux_tools.py --output packaging/staging/sonara/tools
      - name: Stage macOS Poppler and Tesseract
        if: runner.os == 'macOS'
        run: bash packaging/stage_macos_tools.sh packaging/staging/sonara/tools
      - name: Sign bundled macOS document tools
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash packaging/sign_macos_tools.sh packaging/staging/sonara/tools
      - name: Smoke-check staged PDF and OCR tools
        run: python packaging/check_native_tools.py --tools packaging/staging/sonara/tools
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@2.10.1
      - name: Install native Python runtime dependencies
        # --no-deps keeps llama-cpp-python's diskcache dependency
        # (PYSEC-2026-2447, no fixed release) out of the build and the bundle.
        run: |
          python -m pip install -r packaging/requirements-runtime.txt
          python -m pip install --no-deps -r packaging/requirements-runtime-nodeps.txt
      - name: Build frozen backend runtime
        run: python packaging/build_runtime.py --clean
      - name: Smoke-check the frozen inference runtime
        run: python packaging/check_frozen_runtime.py packaging/staging/sonara/sonara-runtime${{ runner.os == 'Windows' && '.exe' || '' }}
      - name: Prepare Windows code signing
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SONARA_WINDOWS_PFX_BASE64: ${{ secrets.SONARA_WINDOWS_PFX_BASE64 }}
          SONARA_WINDOWS_PFX_PASSWORD: ${{ secrets.SONARA_WINDOWS_PFX_PASSWORD }}
        run: ./packaging/prepare_windows_signing.ps1
      - name: Install frontend dependencies
        working-directory: ui-react
        run: npm ci
      - name: Build frontend
        working-directory: ui-react
        run: npm run build
      - name: Build native installer
        # Tauri signs and notarizes macOS bundles from the APPLE_* variables.
        # It treats a variable that is set but empty as a certificate to
        # import, so unset every empty one: without the secrets the macOS
        # bundle is built unsigned instead of failing in `security import`.
        shell: bash
        env:
          SONARA_APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          SONARA_APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          SONARA_APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          SONARA_APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          SONARA_APPLE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_PASSWORD || '' }}
          SONARA_APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="SONARA_$name"
            if [[ -n "${!value}" ]]; then export "$name=${!value}"; fi
            unset "$value"
          done
          if [[ "$RUNNER_OS" == "macOS" && -z "${APPLE_CERTIFICATE:-}" ]]; then
            # No Developer ID certificate: sign the app ad hoc ("-"), which
            # Apple Silicon needs to run it. It is not notarized.
            echo "::warning::Apple signing secrets are not configured; building an ad hoc signed, unnotarized macOS app."
            export APPLE_SIGNING_IDENTITY=-
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          tauri build --bundles ${{ matrix.bundle }}
      - name: Remove the bundled Wayland libraries from the AppImage
        # They crash the app on newer hosts whose GPU driver expects the
        # system libwayland (seen with NVIDIA on Ubuntu 26.04).
        if: runner.os == 'Linux'
        run: |
          for appimage in src-tauri/target/release/bundle/appimage/*.AppImage; do
            bash packaging/strip_appimage_wayland.sh "$appimage"
          done
      - name: Remove temporary macOS signing identity
        if: runner.os == 'macOS' && always()
        run: bash packaging/cleanup_macos_signing.sh
      - name: Normalize installer names
        run: python packaging/prepare_release_assets.py --bundle-root src-tauri/target/release/bundle --platform ${{ matrix.platform }} --arch ${{ matrix.arch }} --output release-assets
      - name: Write the installer SBOM
        # Run with the Python that froze the runtime, so its installed
        # distributions are what the SBOM lists. Crates are narrowed to this
        # target; the timestamp is the commit time, for reproducible output.
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          (cd src-tauri && cargo metadata --format-version 1 --locked --filter-platform "$host") > "$RUNNER_TEMP/cargo-metadata.json"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" python packaging/generate_sbom.py \
            --version "$RELEASE_TAG" \
            --platform "${{ matrix.platform }}-${{ matrix.arch }}" \
            --cargo-metadata "$RUNNER_TEMP/cargo-metadata.json" \
            --tools packaging/staging/sonara/tools \
            --output "release-assets/Sonara-${{ matrix.platform }}-${{ matrix.arch }}.cdx.json"
      - name: Upload installer files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Clean-runner install check · ${{ matrix.label }}
    needs: [validate, package]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.package_matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets
      - name: Install Windows package and verify preserved user data
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/smoke_installed_windows.ps1 -Installer release-assets/Sonara-windows-x86_64-setup.exe
      - name: Install Linux runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libayatana-appindicator3-1 librsvg2-2 libgtk-3-0 libwebkit2gtk-4.1-0 xvfb
      - name: Install Linux package and verify AppImage
        if: runner.os == 'Linux'
        run: bash packaging/smoke_installed_linux.sh release-assets
      - name: Install macOS image and verify the app
        if: runner.os == 'macOS'
        env:
          # Without a Developer ID the build is ad hoc signed and unnotarized,
          # so the Gatekeeper and stapler checks are skipped; the rest still run.
          SONARA_MACOS_UNSIGNED: ${{ secrets.APPLE_CERTIFICATE == '' && '1' || '' }}
        run: bash packaging/smoke_installed_macos.sh "release-assets/Sonara-macos-${{ matrix.arch }}.dmg"

  publish:
    name: Publish GitHub Release
    needs: smoke
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      # Keyless Sigstore signing of the build provenance attestations.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Require platform signing credentials before publication
        env:
          RELEASE_TARGET: ${{ inputs.target || 'unix' }}
          WINDOWS_PFX: ${{ secrets.SONARA_WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.SONARA_WINDOWS_PFX_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$RELEASE_TARGET" == "all" || "$RELEASE_TARGET" == "windows" ]]; then
            test -n "$WINDOWS_PFX" && test -n "$WINDOWS_PFX_PASSWORD" || { echo "Windows signing secrets are required."; exit 1; }
          fi
          if [[ "$RELEASE_TARGET" == "all" || "$RELEASE_TARGET" == "unix" || "$RELEASE_TARGET" == "macos" ]]; then
            if [[ -z "$APPLE_CERTIFICATE" ]]; then
              # No Developer ID yet: the macOS image is ad hoc signed and
              # unnotarized, and the release notes say so.
              echo "::warning::Publishing an unsigned, unnotarized macOS image."
            else
              test -n "$APPLE_CERTIFICATE_PASSWORD" && test -n "$APPLE_SIGNING_IDENTITY" || { echo "Apple Developer signing secrets are incomplete."; exit 1; }
              test -n "$APPLE_ID" && test -n "$APPLE_PASSWORD" && test -n "$APPLE_TEAM_ID" || { echo "Apple notarization credentials are required."; exit 1; }
            fi
          fi
      - name: Download all installer assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify release assets are complete
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_TARGET: ${{ inputs.target || 'unix' }}
        run: python packaging/verify_release_assets.py release-assets --platform "$RELEASE_TARGET"
      - name: Write installer checksums
        run: |
          # One checksum file per run so a later platform-scoped run cannot collide with it.
          sum_file="SHA256SUMS-${RELEASE_TARGET}.txt"
          (cd release-assets && sha256sum $(ls | grep -v '^SHA256SUMS') > "$sum_file")
        env:
          RELEASE_TARGET: ${{ inputs.target || 'unix' }}
      - name: Attest build provenance for every release file
        # Signs, with this workflow's identity, which commit and run produced
        # each installer, SBOM and checksum file. Verify a download with
        # `gh attestation verify <file> --repo <owner>/Sonara`.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publish release and installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          MACOS_UNSIGNED: ${{ secrets.APPLE_CERTIFICATE == '' && '1' || '' }}
        run: |
          notice=""
          if [[ "$MACOS_UNSIGNED" == "1" ]] && ls release-assets/Sonara-macos-*.dmg >/dev/null 2>&1; then
            notice="**macOS:** this build is not signed with an Apple Developer ID or notarized, so macOS blocks it on first launch. Open it once from System Settings → Privacy & Security → Open Anyway, or run \`xattr -dr com.apple.quarantine /Applications/Sonara.app\`."
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
            if [[ -n "$notice" && "$body" != *"Apple Developer ID"* ]]; then
              gh release edit "$RELEASE_TAG" --notes "$(printf '%s\n\n%s' "$notice" "$body")"
            fi
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "Sonara $RELEASE_TAG" \
              --notes "$notice" \
              --generate-notes
          fi
