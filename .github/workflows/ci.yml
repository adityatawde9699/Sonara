name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python unit tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the packaged release runtime is built with; 3.14 is
        # the development baseline.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q benchmark.py document.py listening_eval.py llm_client.py narration.py ocr.py piper_worker.py resource_policy.py sonara.py tts_engine.py tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  desktop:
    name: React and Rust validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui-react/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev librsvg2-dev libgtk-3-dev libwebkit2gtk-4.1-dev libssl-dev libxdo-dev patchelf
      - name: Install frontend dependencies
        working-directory: ui-react
        run: npm ci
      - name: Prepare Python runtime for Rust worker tests
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip check
      - name: Run frontend tests
        working-directory: ui-react
        run: npm test
      - name: Lint frontend
        working-directory: ui-react
        run: npm run lint
      - name: Build frontend
        working-directory: ui-react
        run: npm run build
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Prepare Tauri resource path for Rust tests
        run: mkdir -p packaging/staging/sonara && touch packaging/staging/sonara/.ci-placeholder
      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: stable
      - name: Audit frontend dependencies
        working-directory: ui-react
        run: npm audit --audit-level=moderate
      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1
      # llama-cpp-python is installed with --no-deps so its diskcache dependency
      # (PYSEC-2026-2447, unsafe pickle, no fixed release) is never installed;
      # the *-nodeps files are audited the same way. No advisory is ignored.
      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r requirements.txt --progress-spinner off
          python -m pip_audit -r requirements-llm.txt --progress-spinner off
          python -m pip_audit -r requirements-llm-nodeps.txt --no-deps --disable-pip --progress-spinner off
          python -m pip_audit -r packaging/requirements-runtime.txt --progress-spinner off
          python -m pip_audit -r packaging/requirements-runtime-nodeps.txt --no-deps --disable-pip --progress-spinner off
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock
